# web2apk default configuration
# GitHub Actions repository variables with the same names override these values.
# Local builds can override any value with: ./gradlew assembleDebug -PKEY=value

WEB_URL=https://example.com
APP_NAME=Website To APK
PACKAGE_NAME=com.example.websitetopk
VERSION_NAME=1.1.0
VERSION_CODE=2
MIN_SDK=24
TARGET_SDK=35
ORIENTATION=unspecified

ENABLE_JAVASCRIPT=true
ENABLE_DOM_STORAGE=true
ENABLE_PULL_TO_REFRESH=true
ALLOW_EXTERNAL_LINKS=true
ENABLE_DOWNLOADS=true
ENABLE_FILE_UPLOAD=true
ENABLE_FULLSCREEN_VIDEO=true
ENABLE_FULLSCREEN=true
ENABLE_CUSTOM_SCRIPTS=true
# Comma-separated JS files relative to custom/. Empty = all JS under custom/scripts/.
CUSTOM_JS_FILES=
ENABLE_LOGGING=true

PERMISSION_INTERNET=true
PERMISSION_CAMERA=false
PERMISSION_MICROPHONE=false
PERMISSION_LOCATION=false
PERMISSION_NOTIFICATIONS=false
PERMISSION_STORAGE=false
PERMISSION_CONTACTS=false
PERMISSION_PHONE=false
PERMISSION_CALENDAR=false
PERMISSION_BLUETOOTH=false
PERMISSION_VIBRATE=true
PERMISSION_NFC=false

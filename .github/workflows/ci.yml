name: Build Website APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WEB_URL: ${{ vars.WEB_URL || 'https://example.com' }}
      APP_NAME: ${{ vars.APP_NAME || 'BoltDownloader' }}
      PACKAGE_NAME: ${{ vars.PACKAGE_NAME || 'com.boltdownloader.app' }}
      VERSION_NAME: ${{ vars.VERSION_NAME || '1.0.0' }}
      VERSION_CODE: ${{ vars.VERSION_CODE || '1' }}
      MIN_SDK: ${{ vars.MIN_SDK || '24' }}
      TARGET_SDK: ${{ vars.TARGET_SDK || '35' }}
      ORIENTATION: ${{ vars.ORIENTATION || 'unspecified' }}
      ENABLE_JAVASCRIPT: ${{ vars.ENABLE_JAVASCRIPT || 'true' }}
      ENABLE_DOM_STORAGE: ${{ vars.ENABLE_DOM_STORAGE || 'true' }}
      ENABLE_PULL_TO_REFRESH: ${{ vars.ENABLE_PULL_TO_REFRESH || 'true' }}
      ALLOW_EXTERNAL_LINKS: ${{ vars.ALLOW_EXTERNAL_LINKS || 'true' }}
      ENABLE_DOWNLOADS: ${{ vars.ENABLE_DOWNLOADS || 'true' }}
      ENABLE_FILE_UPLOAD: ${{ vars.ENABLE_FILE_UPLOAD || 'true' }}
      ENABLE_FULLSCREEN_VIDEO: ${{ vars.ENABLE_FULLSCREEN_VIDEO || 'true' }}
      PERMISSION_CAMERA: ${{ vars.PERMISSION_CAMERA || 'false' }}
      PERMISSION_MICROPHONE: ${{ vars.PERMISSION_MICROPHONE || 'false' }}
      PERMISSION_LOCATION: ${{ vars.PERMISSION_LOCATION || 'false' }}
      PERMISSION_NOTIFICATIONS: ${{ vars.PERMISSION_NOTIFICATIONS || 'false' }}
      PERMISSION_STORAGE: ${{ vars.PERMISSION_STORAGE || 'false' }}
      PERMISSION_CONTACTS: ${{ vars.PERMISSION_CONTACTS || 'false' }}
      PERMISSION_PHONE: ${{ vars.PERMISSION_PHONE || 'false' }}
      PERMISSION_CALENDAR: ${{ vars.PERMISSION_CALENDAR || 'false' }}
      PERMISSION_BLUETOOTH: ${{ vars.PERMISSION_BLUETOOTH || 'false' }}
      PERMISSION_VIBRATE: ${{ vars.PERMISSION_VIBRATE || 'true' }}
      PERMISSION_NFC: ${{ vars.PERMISSION_NFC || 'false' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Gradle configuration
        shell: bash
        run: |
          gradle --version
          gradle :app:tasks --all --no-daemon

      - name: Build debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace \
            -PWEB_URL="$WEB_URL" \
            -PAPP_NAME="$APP_NAME" \
            -PPACKAGE_NAME="$PACKAGE_NAME" \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PMIN_SDK="$MIN_SDK" \
            -PTARGET_SDK="$TARGET_SDK" \
            -PORIENTATION="$ORIENTATION" \
            -PENABLE_JAVASCRIPT="$ENABLE_JAVASCRIPT" \
            -PENABLE_DOM_STORAGE="$ENABLE_DOM_STORAGE" \
            -PENABLE_PULL_TO_REFRESH="$ENABLE_PULL_TO_REFRESH" \
            -PALLOW_EXTERNAL_LINKS="$ALLOW_EXTERNAL_LINKS" \
            -PENABLE_DOWNLOADS="$ENABLE_DOWNLOADS" \
            -PENABLE_FILE_UPLOAD="$ENABLE_FILE_UPLOAD" \
            -PENABLE_FULLSCREEN_VIDEO="$ENABLE_FULLSCREEN_VIDEO" \
            -PPERMISSION_CAMERA="$PERMISSION_CAMERA" \
            -PPERMISSION_MICROPHONE="$PERMISSION_MICROPHONE" \
            -PPERMISSION_LOCATION="$PERMISSION_LOCATION" \
            -PPERMISSION_NOTIFICATIONS="$PERMISSION_NOTIFICATIONS" \
            -PPERMISSION_STORAGE="$PERMISSION_STORAGE" \
            -PPERMISSION_CONTACTS="$PERMISSION_CONTACTS" \
            -PPERMISSION_PHONE="$PERMISSION_PHONE" \
            -PPERMISSION_CALENDAR="$PERMISSION_CALENDAR" \
            -PPERMISSION_BLUETOOTH="$PERMISSION_BLUETOOTH" \
            -PPERMISSION_VIBRATE="$PERMISSION_VIBRATE" \
            -PPERMISSION_NFC="$PERMISSION_NFC"

      - name: Verify generated BuildConfig
        shell: bash
        run: |
          set -euo pipefail
          BUILD_CONFIG="app/build/generated/source/buildConfig/debug/com/example/websitetopk/BuildConfig.java"
          test -f "$BUILD_CONFIG"
          if grep -nE '= (True|False);' "$BUILD_CONFIG"; then
            echo "Invalid Java boolean literal found in generated BuildConfig"
            exit 1
          fi
          grep -nE 'public static final boolean ' "$BUILD_CONFIG"

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APP_NAME// /-}-debug.apk"
          ls -lh dist/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-to-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
